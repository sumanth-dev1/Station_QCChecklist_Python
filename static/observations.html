      if (!description) return "";
      // Convert &lt;b&gt; into <b> etc.
      const txt = document.createElement("textarea");
      txt.innerHTML = description;
      return txt.value;
    }
    function decodeHtmlEntities(str) {
      if (!str) return "";
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

  const specificOptions = {
    "1.38,1.40,1.41,1.42,1.43,1.45,1.46,1.47,1.48,1.49,1.50,1.51,1.52,1.53,1.54,1.55,1.56,1.57,1.58,1.59,1.60,1.61,1.62,1.63,1.64": ["Matching", "Not Matching", "Verified", "Not Verified", "Not Installed", "Not Applicable"],
    "1.39,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,1.10,1.11,1.12,1.13,1.14,1.15,1.16,1.17,1.18,1.19,1.20,1.21,1.22,1.23,1.24,1.25,1.26,1.27,1.28,1.29,1.30,1.31,1.32,1.33,1.34,1.35,1.36,1.37,1.65,1.66,1.67,1.68": ["Matching", "Not Matching", "Verified", "Not Verified", "Not Installed", "Not Applicable"],
    "3.1,2.1": ["Ok", "Not Ok", "Not Applicable"],
    "5.1.2,5.1.4,5.1.6,9.1,9.2,9.2.1,9.4": ["Ok", "Not Ok","Not Verified"],
    "8.2,8.4,8.7,6.1.2,6.1.4,6.1.5,6.1.6,6.1.7,6.1.8,6.1.9,6.1.11,4.1.4,4.1.5,4.1.7,4.1.8,4.2.4,4.2.5,7.2,7.3,7.4,7.7,7.8,7.9,5.2.4,5.2.6,5.2.7,5.2.8,5.3.2,5.3.3,5.3.4,5.4.5,5.5.4,13.1": ["Ok", "Not Ok", "Not Applicable","Not Verified"],
    "10.1,10.3,10.4,10.5,10.6": ["Ok", "Not Ok", "Not Applicable", "Applicable", "Not Verified"],
    "5.5.1,4.1.1,4.1.2,4.2.1,5.1.1,5.1.5,5.2.1,5.2.2,5.3.1,5.4.1,5.4.6,6.1.1,6.2.1,7.1,8.1,11.2,12.1,12.2":["Ok", "Not Ok", "Not Applicable", "Not Verified","Not Installed"],
    "5.5.2,5.5.3,4.1.3,4.1.6,4.2.2,4.2.3,5.1.3,5.2.3,5.3.5,5.4.2,5.4.3,5.4.4,6.1.3,6.1.10,7.5,7.6,8.3,8.6,10.2,5.2.5":["Ok", "Not Ok", "Not Applicable", "Not Verified","Not Connected"],
    "5.1.2":["Ok", "Not Ok", "Not Applicable", "Not Verified","Not Installed","Not Connected"],
    "5.5.5":["Available", "Not Available", "Available with Comments", "Not Verified","Not Applicable"],
    "6.2.2,7.10,8.5,9.3,11.1": ["Available", "Not Available", "Not Applicable","Not Verified"],
    "5.2.9": ["Available", "Not Available", "Not Applicable","Not Verified","Not deployed"],
    "12.3": ["Available", "Not Available", "Not Applicable"],
    "1.44": ["Matching", "Not Matching", "Verified", "Not Verified", "Not Installed", "Not Applicable"],
    "12.4": ["Ok", "Not Ok", "Not Applicable", "Not Verified","Not Installed","Not Completed"],
  };

    function getCustomRowCount(sectionRows, sectionId) {
      if (!Array.isArray(sectionRows)) return 0;

      const baseline = {
        // Section 1 baseline is 68 rows per metadata and business rule
        "1": new Set(Array.from({ length: 68 }, (_, i) => `1.${i + 1}`)),
        // Section 2 baseline should include all expected rows (not treated as extras)
        "2": new Set(['2.1', '2.2', '2.3', '2.3.1', '2.4', '2.5', '2.6', '2.7', '2.8', '2.9'])
      };

      if (!baseline[sectionId]) return 0;

      return sectionRows.reduce((extra, row) => {
        if (!row || !row.S_no || !baseline[sectionId].has(row.S_no)) {
          return extra + 1;
        }
        return extra;
      }, 0);
    }

  <script>
    const stationDetails = JSON.parse(sessionStorage.getItem('stationInfo'));
    if (stationDetails) {
      const currentDate = new Date();
      const formattedCurrentDate = `${currentDate.getDate().toString().padStart(2, '0')}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}-${currentDate.getFullYear()}`;
      document.getElementById("station-id").textContent = stationDetails.stationId || 'N/A';
      document.getElementById("station-name").textContent = stationDetails.stationName || 'N/A';
      document.getElementById("zone").textContent = stationDetails.zone || 'N/A';
      document.getElementById("division").textContent = stationDetails.division || 'N/A';
      document.getElementById("section-name").textContent = stationDetails.sectionName || 'N/A';
      document.getElementById("initial-date").textContent = formatDateDDMMYYYY(stationDetails.initialDate) || 'N/A';
      document.getElementById("updated-date").textContent = formatDateDDMMYYYY(stationDetails.updatedDate) || 'N/A';
      // preserve raw date in session for filename use
      stationDetails.rawInitialDate = normalizeDateToYYYYMMDD(stationDetails.initialDate);
      stationDetails.rawUpdatedDate = normalizeDateToYYYYMMDD(stationDetails.updatedDate);
      sessionStorage.setItem('stationInfo', JSON.stringify(stationDetails));
    } else {
      console.error('Station details not found in sessionStorage');
    }

    async function fetchObservations() {
      let stationId = stationDetails?.stationId;
      if (!stationId) {
        console.error("Station ID is missing.");
        return { status: 'error', message: 'Station ID is missing' };
      }
      try {
        const response = await fetch(`fetch_observations?station_id=${stationId}&_=${Date.now()}`);
        const text = await response.text();
        console.log("Raw backend response:", text);
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseError) {
          console.error("JSON parsing error:", parseError, "Raw text:", text);
          return { status: 'error', message: 'Invalid JSON format from backend' };
        }
        if (data.status === 'success' && Array.isArray(data.data)) {
          window.totalCustomPoints = data.total_custom_points || 0;
          // Keep all data for calculation, but filter for detailed view later if needed
        }
        return data;
      } catch (error) {
        console.error("Fetch error:", error);
        return { status: 'error', message: error.message || 'Network error occurred' };
      }
    }

    function createObservationsTable(observations) {
      const sectionMetadata = {
        "1": { name: "Serial Number verification", base: 68 },
        "2": { name: "Building", base: 1 },
        "3": { name: "Tower", base: 1 },
        "4": { name: "Power Supply", base: 13 },
        "5": { name: "Kavach  Equipment", base: 31 },
        "6": { name: "RF Communication equipment on tower", base: 13 },
        "7": { name: "OFC Networking rack", base: 10 },
        "8": { name: "Relay rack", base: 7 },
        "9": { name: "Earthing", base: 5 },
        "10": { name: "Indoor wiring / cabling", base: 6 },
        "11": { name: "Outdoor cabling", base: 2 },
        "12": { name: "RFID Tags", base: 4 },
        "13": { name: "Components Inspection", base: 1 },
      };

      const subSectionMetadata = {

        "4.1": "4.1 PDU(Power Distribution Unit)",
        "4.2": "4.2 DC-DC Converter",
        "5.1": "5.1 Kavach Unit",
        "5.2": "5.2 SMOCIP(Station Master's Operation-Cum-Indication Panel)",
        "5.3": "5.3 GPS/GSM Antennas",
        "5.4": "5.4 RIU(Remote Interface Unit)",
        "5.5": "5.5 EI Protocol Converter"
      };

      const detailedObservationsDiv = document.createElement("div");
      detailedObservationsDiv.id = "detailed-observations-container";

      const grouped = {};
      observations.forEach(obs => {
        const snoStr = obs.S_no ? String(obs.S_no) : "";
        const section = snoStr.includes('.') ? snoStr.split('.')[0] : null;
        if (!section) {
          console.warn(`Invalid S_no: ${obs.S_no}`);
          return;
        }
        if (!grouped[section]) grouped[section] = [];
        grouped[section].push(obs);
      });

      let totalClosedPointsOverall = 0;
      let totalPointsOverallTracker = 0;

      const sectionStats = {};
      Object.keys(sectionMetadata).forEach(id => {
        const base = sectionMetadata[id].base;
        const sectionRows = grouped[id] || [];

        // Count custom rows according to defined baseline S_no values.
        // Base section totals remain fixed by sectionMetadata unless explicit non-baseline extras exist.
        const customCount = getCustomRowCount(sectionRows, id);

        let closed = 0;
        let naCount = 0;
        sectionRows.forEach(obs => {
          const status = obs.observation_status ? obs.observation_status.trim() : "";
          if (status === "Not Applicable") {
            naCount++;
          } else {
            const isClosed = ["Available", "Present", "Ok", "Yes", "Routing Done", "Fixed", "Secured", "Installed", "Connected", "Aligned", "Torquing done", "Positioning done", "Configured", "Welding done", "Earthing done", "Matching", "Not Applicable", "Applicable", "Coating done", "Applied", "Cables Connected", "Metal clamps implemented", "Locked", "Verified", "Verified and ok"].includes(status);
            if (isClosed) closed++;
          }
        });

        const sectionTotal = Math.max(0, base + customCount - naCount);

        sectionStats[id] = {
          name: sectionMetadata[id].name,
          total: sectionTotal,
          closed: closed
        };

        totalClosedPointsOverall += closed;
        totalPointsOverallTracker += sectionTotal;
      });

      const totalPointsOverall = totalPointsOverallTracker;
      const totalClosedPoints = totalClosedPointsOverall;

      // Create detailed rows per section
      Object.keys(grouped).sort((a, b) => Number(a) - Number(b)).forEach(section => {
        const sectionRows = grouped[section];
        const sectionTable = document.createElement("table");
        sectionTable.className = "observations-table";
        sectionTable.style.marginBottom = "20px";

        // Check if various Sections are fully "Not Applicable" (but exclude section 6 subsection 5.1 if desired, though here we prioritize user's wish to collapse whole sections)
        const isSection6Sub51 = section === "6" && sectionRows.length > 0 && sectionRows[0].S_no && sectionRows[0].S_no.startsWith("5.1");
        if ((section === "2" || section === "3" || section === "4" || section === "5" || (section === "6" && !isSection6Sub51) || section === "7" || section === "8" || section === "9" || section === "10" || section === "11" || section === "12" || section === "13") && sectionRows.length > 0 && sectionRows.every(obs => obs.observation_status === "Not Applicable")) {
          const naDiv = document.createElement("div");
          naDiv.style.marginBottom = "20px";

          // Add Header (similar to table header style but simpler)
          const headerTable = document.createElement("table");
          headerTable.style.width = "100%";
          headerTable.style.borderCollapse = "collapse";
          headerTable.style.marginBottom = "5px";
          const sectionName = sectionMetadata[section] ? sectionMetadata[section].name : `Section ${section}`;
          headerTable.innerHTML = `
                <tr style="background: #f0f8ff;">
                    <td style="font-weight:bold; padding: 10px; border: 1px solid black;">
                        ${section}.0 ${sectionName}
                    </td>
                </tr>
            `;
          naDiv.appendChild(headerTable);

          const p = document.createElement("p");
          p.style.padding = "10px";
          p.style.fontWeight = "bold";
          p.style.color = "green";
          p.textContent = "Not Applicable";
          naDiv.appendChild(p);

          detailedObservationsDiv.appendChild(naDiv);
          return; // Skip table generation
        }

        const hasRequirement = section !== "1";



        let headerHTML = `

          <thead>

            <tr>

              <th style="text-align: center;">S.No</th>

              <th>${section === "1" ? "Units" : "Aspect"}</th>

              ${hasRequirement ? "<th>Requirement</th>" : ""}

              <th>Status</th>

              <th>Observation</th>

              <th>Image</th>

            </tr>

          </thead>

          <tbody></tbody>

        `;
        sectionTable.innerHTML = headerHTML;
        const tbody = sectionTable.querySelector("tbody");

        if (section !== "1" && section !== "2") {
          let startTime = '', completedTime = '', totalTime = '';
          let startDateObj = null, completedDateObj = null;
          if (sectionRows.length > 0) {
            const parseDate = s => {
              if (!s || typeof s !== 'string') return null;
              const date = new Date(s.replace(' ', 'T'));
              return isNaN(date.getTime()) ? null : date;
            };
            const createdTimes = sectionRows.map(obs => parseDate(obs.created_at)).filter(Boolean);
            const updatedTimes = sectionRows.map(obs => parseDate(obs.updated_at)).filter(Boolean);
            if (createdTimes.length > 0) {
              startDateObj = new Date(Math.min(...createdTimes));
              startTime = startDateObj.toLocaleString();
            }
            if (updatedTimes.length > 0) {
              completedDateObj = new Date(Math.max(...updatedTimes));
              completedTime = completedDateObj.toLocaleString();
            } else if (createdTimes.length > 0) {
              completedDateObj = new Date(Math.max(...createdTimes));
              completedTime = completedDateObj.toLocaleString();
            }
            if (startDateObj && completedDateObj) {
              const ms = completedDateObj - startDateObj;
              const totalSeconds = Math.floor(ms / 1000);
              const hours = Math.floor(totalSeconds / 3600);
              const minutes = Math.floor((totalSeconds % 3600) / 60);
              const seconds = totalSeconds % 60;
              totalTime = `${hours}h ${minutes}m ${seconds}sec`;
            }
          }
          const summaryTr = document.createElement("tr");
          summaryTr.style.background = "#f0f8ff";
          summaryTr.innerHTML = `
            <td colspan="${hasRequirement ? 6 : 5}" style="font-weight:bold;">
              Section ${section} — ${sectionMetadata[section] ? sectionMetadata[section].name : ''}
            </td>
          `;
          tbody.appendChild(summaryTr);
        } else {
          // Add a simple section header for Section 1 and 2 too if needed
          const summaryTr = document.createElement("tr");
          summaryTr.style.background = "#f0f8ff";
          summaryTr.innerHTML = `
            <td colspan="${hasRequirement ? 6 : 5}" style="font-weight:bold;">
              Section ${section} — ${sectionMetadata[section] ? sectionMetadata[section].name : ''}
            </td>
          `;
          tbody.appendChild(summaryTr);
        }

        // Group rows by subsection for independent NA checks
        const rowsBySub = {};
        sectionRows.forEach(obs => {
          const parts = String(obs.S_no).split('.');
          const subKey = parts.length >= 2 ? parts[0] + "." + parts[1] : "base";
          if (!rowsBySub[subKey]) rowsBySub[subKey] = [];
          rowsBySub[subKey].push(obs);
        });

        // Sort keys numerically
        const sortedSubKeys = Object.keys(rowsBySub).sort((a, b) => {
          if (a === "base") return 1; if (b === "base") return -1;
          const aParts = a.split('.').map(Number); const bParts = b.split('.').map(Number);
          for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
            const av = aParts[i] || 0; const bv = bParts[i] || 0;
            if (av !== bv) return av - bv;
          }
          return 0;
        });

        sortedSubKeys.forEach(subKey => {
          const subRows = rowsBySub[subKey];
          const activeSubRows = subRows.filter(obs => obs.observation_status && obs.observation_status.trim() !== '' && obs.observation_status.trim() !== 'Select');
          if (activeSubRows.length === 0) return;

          // Check if ALL rows in subsection are "Not Applicable" (not just active ones)
          // Only collapse if every single row in this subsection is explicitly marked "Not Applicable"
          const isSubAllNA = subRows.every(obs => obs.observation_status === "Not Applicable");
          let subTitle = subSectionMetadata[subKey] || subKey;
          if (subKey === "5.5") {
            const stId = (typeof stationDetails !== 'undefined' && stationDetails && (stationDetails.stationId || stationDetails.station_id)) ? (stationDetails.stationId || stationDetails.station_id) : ((typeof stationInfo !== 'undefined' && stationInfo && stationInfo.station_id) ? stationInfo.station_id : (document.getElementById('station-id')?.textContent?.trim() || ''));
            const savedOem = (stId ? localStorage.getItem(`oem_name_5_5_${stId}`) : null) || localStorage.getItem('oem_name_5_5') || '';
            if (savedOem) subTitle += ` (OEM: ${savedOem})`;
          }

          // SPECIAL RULE: Only collapse if it's a known subsection (part of 4, 5, or 6) AND ALL rows are "Not Applicable"
          if (isSubAllNA && subSectionMetadata[subKey]) {
            const subTr = document.createElement("tr");
            subTr.style.background = "#e6f2ff";
            subTr.innerHTML = `
                 <td colspan="${hasRequirement ? 3 : 2}" style="font-weight:bold; color: #0056b3; padding: 10px;">${subTitle}</td>
                 <td colspan="3" style="color: green; font-weight: bold; text-align: center;">Not Applicable</td>
              `;
            tbody.appendChild(subTr);
          } else {
            if (subSectionMetadata[subKey]) {
              const headTr = document.createElement("tr");
              headTr.style.background = "#e6f2ff";
              headTr.innerHTML = `<td colspan="${hasRequirement ? 6 : 5}" style="font-weight:bold; color: #0056b3; padding-left: 20px;">${subTitle}</td>`;
              tbody.appendChild(headTr);
            }

            activeSubRows.forEach(obs => {
              const formattedDescription = formatDescription(obs.observation_text);
              let displayDescription = formattedDescription;
              if (obs.barcode_kavach_main_unit && obs.barcode_kavach_main_unit.trim() !== '') {
                const cleanBarcode = obs.barcode_kavach_main_unit.trim();
                displayDescription = displayDescription.split(cleanBarcode).join('').trim();
                while (displayDescription.endsWith('-')) { displayDescription = displayDescription.slice(0, -1).trim(); }
                displayDescription += ` - ${cleanBarcode}`;
              }

              let statusText = (obs.observation_status || '').trim();
              let statusColor = '';
              const isGreen = ["Available", "Present", "Ok", "Yes", "Routing Done", "Fixed", "Secured", "Installed", "Connected", "Aligned", "Torquing done", "Positioning done", "Configured", "Welding done", "Earthing done", "Matching", "Not Applicable", "Applicable", "Coating done", "Applied", "Cables Connected", "Metal clamps implemented", "Locked", "Verified", "Verified and ok"].includes(statusText);
              if (isGreen) statusColor = 'green';
              else if (["Not Present", "No", "Not Matching", "Not Installed", "Found Not Ok", "Not Implemented", "Not Fixed", "Not Connected", "Routing Not done", "Voltage found not Ok", "Torquing Not done", "Not Done", "Not Ok", "PCCL Not Done", "Earthing Not done", "Not deployed", "Identification Not Done", "Cable ties not implemented", "Not Verified", "Quantity Not Matched", "Not Available", "Not Completed", "Available with Comments"].includes(statusText)) statusColor = 'red';
              else statusColor = 'yellow';

              const tr = document.createElement("tr");
              let imageHTML = 'No Image';
              if (obs.image_paths && Array.isArray(obs.image_paths) && obs.image_paths.length > 0) {
                imageHTML = obs.image_paths.map(path => `<img src="${path}" onclick="window.open('${path}', '_blank')" style="max-width: 100px; cursor: pointer; margin-right:5px;" />`).join('');
              }
              tr.innerHTML = `
                <td style="text-align: center;">${obs.S_no}</td>
                <td>${displayDescription}</td>
                ${hasRequirement ? `<td>${obs.requirement_text || "N/A"}</td>` : ""}
                <td style="color: ${statusColor}; font-weight: bold;">${statusText}</td>
                <td>${obs.remarks}</td>
                <td>${imageHTML}</td>`;
              tbody.appendChild(tr);
            });
          }
        });

    function groupObservationsBySection(observations) {
      if (!Array.isArray(observations)) {

      observations.forEach(observation => {

        if (!section) {
          console.warn(`Invalid S_no: ${observation.S_no}`);
          return;
        }
        if (!grouped[section]) {
          grouped[section] = [];
        }
        grouped[section].push(observation);
      });
      console.log('Grouped Obs:', grouped);
      return grouped;
    }

    function formatDateString(dateString) {
      if (!dateString || typeof dateString !== 'string') return 'N/A';
      const dateParts = dateString.split('-');
      if (dateParts.length !== 3) return 'N/A';
      return `${dateParts[0]}-${dateParts[1]}-${dateParts[2]}`;
    }

    function formatDateDDMMYYYY(dateString) {
      if (!dateString || typeof dateString !== 'string') return 'N/A';
      const dateParts = dateString.split('-');
      if (dateParts.length !== 3) return 'N/A';
      return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
    }

    function normalizeDateToYYYYMMDD(dateString) {
      if (!dateString || typeof dateString !== 'string') return 'N/A';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
        return dateString;
      }
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
        const [dd, mm, yyyy] = dateString.split('/');
        return `${yyyy}-${mm}-${dd}`;
      }
      // try convert if date object or other format
      const parsed = new Date(dateString);
      if (!isNaN(parsed.getTime())) {
        const y = parsed.getFullYear();
        const m = String(parsed.getMonth() + 1).padStart(2, '0');
        const d = String(parsed.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return 'N/A';
    }

            else if (sectionId === "4") description = "(Power Supply - DC-DC Converter)";
            else if (sectionId === "5") description = "(Kavach Equipment)";
            else if (sectionId === "6") description = "(RF Communication Equipment)";
            else if (sectionId === "7") description = "(OFC Networking Rack)";
            else if (sectionId === "8") description = "(Relay Rack)";
            else if (sectionId === "9") description = "(Earthing)";
            else if (sectionId === "10") description = "(Indoor Wiring / Cabling)";
            else if (sectionId === "11") description = "(Outdoor Cabling)";
            else if (sectionId === "12") description = "(RFID Tags)";
            else if (sectionId === "13") description = "(Components Inspection)";

            const title = sectionCaptions[sectionId] || `Observations for Section ${sectionId}`;

            pdf.autoTable({
              startY: finalY,
              head: [],
              body: [
                [
                  { content: `${title} ${description}`, styles: { textColor: [0, 0, 255], halign: 'left' } },
                  { content: "Not Applicable", styles: { textColor: [0, 128, 0], halign: 'right' } }
                ]
              ],
              theme: 'grid',
              styles: {
                font: 'helvetica',
                fontStyle: 'bold',
                fontSize: 12,
                cellPadding: 2, // Decrease padding to reduce height
                valign: 'middle',
                lineColor: [0, 0, 0],
                lineWidth: 0.5
              },
              columnStyles: {
                0: { cellWidth: 'auto' },
                1: { cellWidth: 40 }
              },
              margin: { left: 14, right: 10 } // Adjust left margin to align with standard tables
            });

            finalY = pdf.lastAutoTable.finalY + 10;
            continue;
          }

          const sectionCaption = sectionCaptions[sectionId] || `Observations for Section ${sectionId}`;
          const sectionHeaderHeight = 8;

          pdf.setFont("helvetica", "bold")
            .setFontSize(12)
            .setTextColor(0, 0, 255)
            .text(sectionCaption, 10, finalY);
          finalY += sectionHeaderHeight;


          // Time table removed as per user request


          // Used pre-loaded imageData from outer scope for efficiency
          const rows = sectionObservations.map(obs => {
            const imagesCount = imageData[obs.S_no]?.length || 0;
            const calculatedHeight = imagesCount > 0 ? Math.max(30, imagesCount * 28) : 0;
            return {
              S_no: obs.S_no,
              Description: decodeHtmlEntities(formatDescription(obs.observation_text)).trim(),
              barcode: obs.barcode_kavach_main_unit,
              Requirement: (obs.requirement_text || "N/A").trim(),
              Status: obs.observation_status,
              Remarks: obs.remarks,
              imageBase64: imageData[obs.S_no][0] || "",
              calculatedHeight
            };
          });
          let availableHeight = pageHeight - finalY - footerHeight - bottomMargin;
          if (availableHeight < sectionHeaderHeight + bottomMargin + 30) {
            pdf.addPage();
            finalY = 10;
            availableHeight = pageHeight - finalY - footerHeight - bottomMargin;
          }
          const showRequirement = sectionId !== "1";



          // Build dynamic body for PDF
          const tableBody = [];

          // Group rows by subsection for PDF independent NA checks
          const pdfBySub = {};
          rows.forEach(r => {
            const parts = String(r.S_no).split('.');
            const subKey = parts.length >= 2 ? parts[0] + "." + parts[1] : "base";
            if (!pdfBySub[subKey]) pdfBySub[subKey] = [];
            pdfBySub[subKey].push(r);
          });


          Object.keys(pdfBySub).forEach(subKey => {
            const subRows = pdfBySub[subKey];
            const isSubAllNA = subRows.every(r => r.Status === "Not Applicable");
            let subTitle = subSectionMetadata[subKey] || subKey;
            if (subKey === "5.5") {
              const stId = (typeof stationDetails !== 'undefined' && stationDetails && (stationDetails.stationId || stationDetails.station_id)) ? (stationDetails.stationId || stationDetails.station_id) : ((typeof stationId !== 'undefined' && stationId) ? stationId : (document.getElementById('station-id')?.textContent?.trim() || ''));
              const savedOem = (stId ? localStorage.getItem(`oem_name_5_5_${stId}`) : null) || localStorage.getItem('oem_name_5_5') || '';
              if (savedOem) subTitle += ` (OEM: ${savedOem})`;
            }

            if (isSubAllNA && subSectionMetadata[subKey]) {
              tableBody.push([{
                content: `${subTitle}: Not Applicable`,
                colSpan: showRequirement ? 6 : 5,
                styles: { fillColor: [230, 242, 255], fontStyle: 'bold', textColor: [0, 128, 0] }
              }]);
            } else {
              if (subSectionMetadata[subKey]) {
                tableBody.push([{
                  content: subTitle,
                  colSpan: showRequirement ? 6 : 5,
                  styles: { fillColor: [230, 242, 255], fontStyle: 'bold', textColor: [0, 86, 179] }
                }]);
              }
              subRows.forEach(r => {
                const cleanStatus = decodeHtmlEntities(String(r.Status || "").replace(/<[^>]*>/g, ""));
                let desc = decodeHtmlEntities(String(r.Description || "").replace(/<\/?b>/g, ""));
                if (r.barcode && r.barcode.trim() !== "") {
                  const cleanBarcode = r.barcode.trim();
                  desc = desc.split(cleanBarcode).join('').trim();
                  while (desc.endsWith('-')) { desc = desc.slice(0, -1).trim(); }
                  desc += ` - ${cleanBarcode}`;
                }
                tableBody.push([
                  r.S_no,
                  desc,
                  ...(showRequirement ? [r.Requirement] : []),
                  cleanStatus,
                  r.Remarks,
                  ...(sectionId === "0" ? [] : [{ content: "", raw: r.imageBase64, styles: r.calculatedHeight > 0 ? { minCellHeight: r.calculatedHeight } : {} }])
                ]);
              });
            }
          });

          pdf.autoTable({
            startY: finalY,
            margin: { right: 10 },
            head: [["S.No", sectionId === "1" ? "Units" : "Aspect", ...(showRequirement ? ["Requirement"] : []), "Status", "Observation", ...(sectionId === "0" ? [] : ["Image"])]],
            body: tableBody,
            theme: "grid",
            showHead: 'everyPage',
            rowPageBreak: "avoid",
            styles: {
              fontSize: 10,
              cellPadding: 2,
              overflow: 'linebreak',
              lineWidth: 0.1,
              lineColor: [0, 0, 0],
              halign: 'center',
              valign: 'middle'
            },
            headStyles: {
              textColor: [255, 255, 255],
              fillColor: [0, 102, 204],
              lineWidth: 0.5,
              lineColor: [0, 0, 0]
            },
            bodyStyles: {
              lineWidth: 0.5,
              lineColor: [0, 0, 0],
              valign: 'middle',
              textColor: [0, 0, 0]
            },
            columnStyles: (() => {
              if (sectionId === "1") {
                return {
                  0: { cellWidth: 15, halign: 'center' }, // S.No
                  1: { cellWidth: showRequirement ? 20 : 65, halign: 'left' }, // Description
                  ...(showRequirement ? { 2: { cellWidth: 56, halign: 'left' } } : {}), // Requirement
                  [showRequirement ? 3 : 2]: { cellWidth: 30, halign: 'left' }, // Status
                  [showRequirement ? 4 : 3]: { cellWidth: 35, halign: 'left' }, // Remarks
                  [showRequirement ? 5 : 4]: { cellWidth: 40, halign: 'center' } // Image
                };
              } else {
                // Original column widths for other sections
                return {
                  0: { cellWidth: 15, halign: 'center' }, // S.No
                  1: { cellWidth: showRequirement ? 31 : 52, halign: 'left' }, // Description
                  ...(showRequirement ? { 2: { cellWidth: 51, halign: 'left' } } : {}), // Requirement
                  [showRequirement ? 3 : 2]: { cellWidth: 25, halign: 'left' }, // Status
                  [showRequirement ? 4 : 3]: { cellWidth: 30, halign: 'left' }, // Remarks
                  [showRequirement ? 5 : 4]: { cellWidth: 34, halign: 'center' } // Image
                };
              }
            })()
            ,
            didParseCell: function (data) {
              const statusColIndex = showRequirement ? 3 : 2;
              if (data.row.section === 'body' && data.column.index === statusColIndex) {
                const statusText = String(data.cell.raw).trim();

                const greenStatuses = ["Available", "Present", "Ok", "Yes", "Routing Done", "Fixed", "Secured", "Installed", "Connected", "Aligned", "Torquing done", "Positioning done", "Configured", "Welding done", "Earthing done", "Matching", "Not Applicable", "Applicable", "Coating done", "Applied", "Cables Connected", "Metal clamps implemented", "Locked", "Verified", "Verified and ok"];
                const redStatuses = ["Not Present", "No", "Not Matching", "Not Installed", "Found Not Ok", "Not Implemented", "Not Fixed", "Not Connected", "Routing Not done", "Voltage found not Ok", "Torquing Not done", "Not Done", "Not Ok", "PCCL Not Done", "Earthing Not done", "Not Functioning", "Identification Not Done", "Cable ties not implemented", "Not Joined", "Quantity Not Matched", "Not Available","Not Verified", "Not Completed", "Available with Comments"];

                let textColor = [0, 0, 0]; // Default black

                if (greenStatuses.includes(statusText)) {
                  textColor = [0, 128, 0]; // Green
                } else if (redStatuses.includes(statusText)) {
                  textColor = [255, 0, 0]; // Red
                } else {
                  // Fallback for partial matches if needed, or keeping it strictly matched to lists
                  if (statusText.includes("Not") || statusText.includes("No")) {
                    textColor = [255, 0, 0];
                  }
                }
                data.cell.styles.textColor = textColor;
              }
            },
            didDrawCell: function (data) {
              try {
                const imageColIndex = showRequirement ? 5 : 4;
                if (data.row.section === 'body' && data.column.index === imageColIndex) {
                  // Use data.row.raw[0] to get S_no directly, avoiding index mismatch caused by subsection headers
                  const S_no = data.row.raw[0];

                  // Subsection headers have an object at index 0, so ignore them
                  if (!S_no || typeof S_no === 'object') return;

                  const images = Array.isArray(imageData[S_no]) ? imageData[S_no] : [];
                  if (images.length === 0) {
                    // console.log(`No images for S_no: ${S_no}`);
                    return;
                  }
                  const imgX = data.cell.x + 2;
                  let imgY = data.cell.y + 2;
                  const maxWidth = data.cell.width - 4;
                  const maxCellHeight = Math.max(10, data.cell.height - 4);
                  const individualHeight = Math.min(25, maxCellHeight / images.length - 2);
                  for (const base64 of images) {
                    if (typeof base64 === 'string' && base64.startsWith('data:image/jpeg;base64,')) {
                      pdf.addImage(base64, 'JPEG', imgX, imgY, maxWidth, individualHeight);
                      imgY += individualHeight + 2;
                    } else {
                      console.warn(`Invalid base64 image for S_no: ${S_no}`);
                    }
                  }
                }
              } catch (error) {
                console.error("🚨 Error in didDrawCell function:", error.message, error.stack);
              }
            },
            didCalculateCellHeight: function (data) {
              const imageColIndex = showRequirement ? 5 : 4;
              if (data.row.section === 'body' && data.column.index === imageColIndex) {
                // Ensure S_no is valid (skip header rows which are objects)
                const S_no = data.row.raw[0];
                if (!S_no || typeof S_no === 'object') return;

                const images = Array.isArray(imageData[S_no]) ? imageData[S_no] : [];
                if (images.length === 0) return;
                const imageHeight = 25;
                const spacing = 2;
                const padding = 6;
                const totalImageHeight = (imageHeight + spacing) * images.length - spacing;
                const requiredHeight = totalImageHeight + padding;
                if (requiredHeight > data.cell.height) {
                  data.cell.height = requiredHeight;
                }
              }
            }
          });
          finalY = pdf.lastAutoTable.finalY + 10;
          if (finalY > pageHeight - footerHeight - bottomMargin) {
            pdf.addPage();
            finalY = 10;
          }
        }

        // --- Pending Items Detailed Section (Moved to End) ---
        // --- Pending Items Detailed Section (Moved to End) ---
        const closedStatuses = ["Available", "Present", "Ok", "Yes", "Routing Done", "Fixed", "Secured", "Installed", "Connected", "Aligned", "Torquing done", "Positioning done", "Configured", "Welding done", "Earthing done", "Matching", "Not Applicable", "Applicable", "Coating done", "Applied", "Cables Connected", "Verified", "Locked", "Verified and ok"];

        // Create a Set of closed S_nos for efficient lookup
        const closedSet = new Set();
        observationsArray.forEach(obs => {
          const status = obs.observation_status ? obs.observation_status.trim() : "";
          if (status && closedStatuses.includes(status)) {
            closedSet.add(obs.S_no);
          }
        });

        // Collect pending points by section, splitting out the named subsections.
        const pendingBySection = {};
        Object.keys(sectionMetadata).forEach(id => pendingBySection[id] = new Set());
        Object.keys(subSectionMetadata).forEach(id => pendingBySection[id] = new Set());

        // 1. Build a set of S_nos from actual observations (only active points)
        const requiredSnos = new Set();
        observationsArray.forEach(obs => {
          if (obs.S_no) requiredSnos.add(obs.S_no);
        });

        // 2. Add all specificOptions items so all expected points appear in the pending list
        if (typeof specificOptions !== 'undefined') {
          Object.keys(specificOptions).forEach(keyGroup => {
            keyGroup.split(',').forEach(sno => {
              sno = sno.trim();
              if (sno) {
                requiredSnos.add(sno);
              }
            });
          });
        }

        // 3. Determine Pending: Required - Closed
        const skipPendingSnos = new Set([
          "2.2", "2.3", "2.3.1", "2.4", "2.5", "2.6", "2.7", "2.8",
          "3.2", "3.3", "3.4", "3.4.1", "3.4.2", "3.5", "3.6",
          "4.3", "4.3.1", "4.3.2", "4.3.3", "4.3.4", "4.3.5"
        ]);

        requiredSnos.forEach(sno => {
          if (skipPendingSnos.has(sno)) return;
          if (!closedSet.has(sno)) {
            const snoParts = sno.split('.');
            const sectionId = snoParts[0];
            const subSectionId = snoParts.length >= 2 ? `${snoParts[0]}.${snoParts[1]}` : null;
            const groupId = subSectionId && subSectionMetadata[subSectionId] ? subSectionId : sectionId;
            if (pendingBySection[groupId]) {
              pendingBySection[groupId].add(sno);
            } else {
              // Fallback if sectionId is not standard
              if (!pendingBySection["Other"]) pendingBySection["Other"] = new Set();
              pendingBySection["Other"].add(sno);
            }
          }
        });

        const hasPendingItems = Object.keys(pendingBySection).some(id => pendingBySection[id].size > 0);

        if (hasPendingItems) {
          if (finalY > pageHeight - footerHeight - bottomMargin - 40) {
            pdf.addPage();
            finalY = 10;
          } else {
            finalY += 10;
          }

          pdf.setFontSize(12);
          pdf.setTextColor(0, 0, 255); // Red color
          pdf.setFont("helvetica", "bold");
          pdf.text("The following are the pending items to be verified during the next inspection", 14, finalY);
          finalY += 10;

          const sortedSections = Object.keys(pendingBySection)
            .filter(id => pendingBySection[id].size > 0)
            .sort((a, b) => {
              if (a === 'Other') return 1;
              if (b === 'Other') return -1;
              const aParts = a.split('.').map(Number);
              const bParts = b.split('.').map(Number);
              for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
                const difference = (aParts[i] || 0) - (bParts[i] || 0);
                if (difference !== 0) return difference;
              }
              return 0;
            });

          // Use a table to list each section's pending count and points.
          const pendingSummaryData = sortedSections.map(sectionId => {
            const points = Array.from(pendingBySection[sectionId]).sort((a, b) => {
              // Sort points nicely (1.1, 1.2, 1.10 etc)
              const aParts = a.split('.').map(Number);
              const bParts = b.split('.').map(Number);
              for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
                const av = aParts[i] || 0;
                const bv = bParts[i] || 0;
                if (av !== bv) return av - bv;
              }
              return 0;
            });
            const subSectionName = subSectionMetadata[sectionId];
            const parentSectionId = sectionId.split('.')[0];
            const sectionName = sectionMetadata[parentSectionId] ? sectionMetadata[parentSectionId].name : "";
            const title = subSectionName
              ? (subSectionName.startsWith("Section ") ? subSectionName : `Section ${subSectionName}`)
              : `Section ${sectionId}: ${sectionName || (sectionId === "Other" ? "Other" : "")}`;
            const pointsList = points.join(', ');
            return [title, points.length, pointsList];
          });
          const totalPendingCount = sortedSections.reduce(
            (total, sectionId) => total + pendingBySection[sectionId].size,
            0
          );
          pendingSummaryData.push(["Total", totalPendingCount, ""]);

          pdf.autoTable({
            startY: finalY,
            head: [["Section / Sub-Section Name", "Pending Count", "Pending Points"]],
            body: pendingSummaryData,
            theme: "grid",
            styles: {
              fontSize: 10,
              cellPadding: 3,
              overflow: 'linebreak',
              lineColor: [0, 0, 0], // BLACK border
              lineWidth: 0.5        // border thickness
            },
            headStyles: {
              fillColor: [0, 112, 192],
              textColor: [255, 255, 255],
              lineColor: [0, 0, 0], // ensure header borders are black
              lineWidth: 0.5
            },
            bodyStyles: {
              textColor: [0, 0, 0],
              lineColor: [0, 0, 0], // body borders
              lineWidth: 0.5,
              fillColor: [255, 255, 255]
            },
            columnStyles: {
              0: { cellWidth: 60, fontStyle: 'bold' },
              1: { cellWidth: 20, halign: 'center', fontStyle: 'bold' },
              2: { cellWidth: 'auto' }
            }
          });

          finalY = pdf.lastAutoTable.finalY + 10;
        }
        const totalPages = pdf.internal.getNumberOfPages();
        pdf.setPage(totalPages);
        const tableEndY = pdf.lastAutoTable.finalY || (pdf.internal.pageSize.height / 2);
        const noteY = tableEndY + 10;
        pdf.setFont("helvetica", "bold").setFontSize(12);
        pdf.text(
          "Note : This QC report is generated by the system and does not need a physical signature.",
          pdf.internal.pageSize.width / 2,
          noteY,
          { align: "center" }
        );
        const totalPagesFinal = pdf.internal.getNumberOfPages();
        for (let i = 1; i <= totalPagesFinal; i++) {
          pdf.setPage(i)
            .setFont("helvetica", "normal")
            .setFontSize(10);
          pdf.text("EG-IC-FT-33 Rev4", 10, pdf.internal.pageSize.height - 10);
          pdf.text(
            `Page ${i} of ${totalPagesFinal}`,
            pdf.internal.pageSize.width - 10,
            pdf.internal.pageSize.height - 10,
            { align: "right" }
          );
        }
        const pdfBlob = pdf.output('blob');
        await uploadPDF(pdfBlob, fileName);
      } finally {
        pdfButton.disabled = false;
        pdfButton.textContent = "Convert to PDF";
        pdfButton.style.opacity = "1";
      }
    }

    async function getVersionedFileName(stationId, stationName, updatedDate, completionStatus) {
      try {
        const response = await fetch(`getNextVersion?station_id=${stationId}`);
        const data = await response.json();
        if (data.success) {
          const version = data.version;
          return `${stationName}_${updatedDate}_Report_${completionStatus}_Version-${version}.pdf`;
        } else {
          alert('Error fetching version: ' + data.message);
          return null;
        }
      } catch (error) {
        console.error('Error fetching version:', error);
        alert('Error fetching version');
        return null;
      }
    }

    async function getBase64Image(imgUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imgUrl;
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const maxWidth = 100;
          const maxHeight = 100;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }
          const scale = 6;
          canvas.width = width * scale;
          canvas.height = height * scale;
          const ctx = canvas.getContext("2d");
          ctx.scale(scale, scale);
          ctx.drawImage(img, 0, 0, width, height);
          const base64 = canvas.toDataURL("image/jpeg", 1.0);
          resolve(base64);
        };
        img.onerror = function (error) {
          console.error("Error loading image:", imgUrl, error);
          resolve(null);
        };
      });
    }

    async function fetchReports() {
      const username = localStorage.getItem("user_id");
      if (!username) {
        alert("User ID not found. Cannot fetch reports.");
        return;
      }
      try {
        const response = await fetch(`fetchReports?user_id=${username}`);
        const text = await response.text();
        console.log("Raw response:", text);
        const data = JSON.parse(text);
        if (data.success) {
          console.log("Reports:", data.reports);
          displayReports(data.reports);
        } else {
          alert("Error: " + data.message);
        }
      } catch (error) {
        console.error("Error fetching reports:", error);
        alert("An error occurred while fetching reports.");
      }
    }

    function displayReports(reports) {
      const reportContainer = document.getElementById("reportList");
      if (!reportContainer) {
        console.error("Element with ID 'reportList' not found!");
        return;
      }
      reportContainer.innerHTML = "";
      if (reports.length === 0) {
        reportContainer.innerHTML = "<p>No reports available.</p>";
        return;
      }
      reports.forEach(report => {
        const reportItem = document.createElement("div");
        reportItem.innerHTML = `
          <p><strong>Uploaded By:</strong> ${report.user_id}</p>
          <p><strong>File:</strong> <a href="/Uploads/reports/${report.file_name}" target="_blank">${report.file_name}</a></p>
          <p><strong>Uploaded On:</strong> ${report.upload_date}</p>
          <hr>
        `;
        reportContainer.appendChild(reportItem);
      });
    }


    document.addEventListener("DOMContentLoaded", fetchReports);
    async function uploadPDF(pdfBlob, fileName) {
      const formData = new FormData();
      let cleanFileName = fileName.trim();
      if (!cleanFileName.toLowerCase().endsWith(".pdf")) {
        cleanFileName += ".pdf";
      }
      formData.append('file', pdfBlob, cleanFileName);
      const userId = localStorage.getItem("user_id");
      if (userId) {
        formData.append('user_id', userId);
      } else {
        alert("User ID is missing. Cannot upload report.");
        return;
      }
      const response = await fetch('uploadReport', { method: 'POST', body: formData });
      const data = await response.json();
      if (data.success) {
        alert(data.message);
        const successMessage = document.getElementById("success-message");
        const goToReportBtn = document.getElementById("go-to-report-btn");
        if (successMessage && goToReportBtn) {
          successMessage.style.display = "block";
          goToReportBtn.style.display = "inline-block";
        }
      } else {
        alert("Error uploading report: " + data.message);
      }
    }

    renderObservations();
  </script>
